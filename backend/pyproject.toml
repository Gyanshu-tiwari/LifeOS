[project]
name = "backend"
version = "0.1.0"
description = "Backend for LIFEOS"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "asyncpg>=0.31.0",
    "alembic>=1.20.0",
    "structlog>=26.1.0",
    "firebase-admin>=7.7.0",
    "google-genai>=2.25.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "lifeos"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-httpx>=0.36.2",
]
